name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'template.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Needs three repository settings:
#   secrets   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  for a deploy principal
#             scoped to this stack's resources
#   variable  AWS_REGION                                for example ap-southeast-2
# Your own samconfig.toml supplies the stack name and parameters, so it must be
# committed for this job to work, or pass the values with --parameter-overrides.
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
      # --no-fail-on-empty-changeset makes a no-op push a success, not a failure
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
